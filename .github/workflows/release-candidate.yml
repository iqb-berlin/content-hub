name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      rc_number:
        description: Release candidate number
        required: true
        type: number
      compliance_review:
        description: Completed human license review issue for this source commit
        required: true
        type: string
      migration_classification:
        description: Database migration compatibility
        required: true
        type: choice
        options:
          - none
          - backward-compatible
          - manual

concurrency:
  group: release-candidate
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/content-pool-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/content-pool-frontend

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    permissions:
      checks: read
      actions: read
      issues: read
      contents: read
      packages: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      built_at: ${{ steps.identity.outputs.built_at }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Validate canonical release metadata
        run: ./scripts/check-release-metadata.sh
      - name: Require master as the release source
        run: test "$GITHUB_REF" = refs/heads/master
      - name: Require declared migration classification
        env:
          EXPECTED_CLASSIFICATION: ${{ inputs.migration_classification }}
        run: |
          actual="$(python3 - <<'PY'
          from pathlib import Path
          version = Path("VERSION").read_text().strip()
          text = Path("CHANGELOG.md").read_text()
          section = text.split(f"## [{version}]", 1)[1].split("\n## [", 1)[0]
          for value in ("none", "backward-compatible", "manual"):
              if f"Classification: `{value}`" in section:
                  print(value)
                  break
          PY
          )"
          test "$actual" = "$EXPECTED_CLASSIFICATION" || {
            echo "Workflow classification ${EXPECTED_CLASSIFICATION} differs from CHANGELOG ${actual}" >&2
            exit 1
          }
      - name: Resolve release candidate
        id: release
        env:
          RC_NUMBER: ${{ inputs.rc_number }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          release="v${version}-rc.${RC_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
      - name: Require successful quality gate for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "release-gate")] | sort_by(.completed_at) | last | .conclusion // "missing"')"
          test "$conclusion" = success || {
            echo "release-gate for ${GITHUB_SHA} is ${conclusion}" >&2
            exit 1
          }
      - name: Require full scans and completed human license review
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLIANCE_REVIEW: ${{ inputs.compliance_review }}
        run: |
          python3 scripts/release_compliance.py collect \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --review-issue "$COMPLIANCE_REVIEW" \
            --output-dir "$RUNNER_TEMP/compliance-evidence"
          tar -C "$RUNNER_TEMP/compliance-evidence" -czf compliance-evidence.tar.gz .
      - name: Preserve verified compliance evidence for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-compliance-evidence
          path: compliance-evidence.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Reject reused release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE}:refs/tags/${RELEASE}"
            test "$(git rev-list -n 1 "$RELEASE")" = "$GITHUB_SHA" || {
              echo "Tag ${RELEASE} belongs to a different commit" >&2
              exit 1
            }
            if gh release view "$RELEASE" >/dev/null 2>&1; then
              echo "Release candidate ${RELEASE} is already published" >&2
              exit 1
            fi
            echo "Retrying ${RELEASE} after an incomplete publication"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve retry-safe build identity
        id: identity
        env:
          RELEASE: ${{ steps.release.outputs.release }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          built_at=""
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            ref="${image}:${RELEASE}-build"
            if metadata="$(docker buildx imagetools inspect "$ref" --format '{{json .}}' 2>/dev/null)"; then
              revisions="$(jq -r '[.image[]?.config.Labels["org.opencontainers.image.revision"]] | unique | .[]' <<<"$metadata")"
              versions="$(jq -r '[.image[]?.config.Labels["org.opencontainers.image.version"]] | unique | .[]' <<<"$metadata")"
              created="$(jq -r '[.image[]?.config.Labels["org.opencontainers.image.created"]] | unique | .[]' <<<"$metadata")"
              test "$revisions" = "$GITHUB_SHA"
              test "$versions" = "$VERSION"
              test -n "$created"
              if [[ -n "$built_at" ]]; then
                test "$built_at" = "$created"
              else
                built_at="$created"
              fi
            fi
          done
          if [[ -z "$built_at" ]]; then
            built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          echo "built_at=${built_at}" >> "$GITHUB_OUTPUT"

  backend:
    name: Build and scan backend
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve existing candidate build
        id: existing
        env:
          RELEASE: ${{ needs.validate.outputs.release }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ref="${BACKEND_IMAGE}:${RELEASE}-build"
          if ! metadata="$(docker buildx imagetools inspect "$ref" --format '{{json .}}' 2>/dev/null)"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(jq -r '[.image[]?.config.Labels["org.opencontainers.image.revision"]] | unique | .[]' <<<"$metadata")" = "$GITHUB_SHA"
          test "$(jq -r '[.image[]?.config.Labels["org.opencontainers.image.version"]] | unique | .[]' <<<"$metadata")" = "$VERSION"
          test "$(jq -r '[.image[]?.config.Labels["org.opencontainers.image.created"]] | unique | .[]' <<<"$metadata")" = "${{ needs.validate.outputs.built_at }}"
          echo "digest=$(jq -r .manifest.digest <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "exists=true" >> "$GITHUB_OUTPUT"
      - name: Build backend once
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ needs.validate.outputs.release }}-build
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ needs.validate.outputs.built_at }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Resolve backend digest
        id: image
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Scan published backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}@${{ steps.image.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'

  frontend:
    name: Build and scan frontend
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve existing candidate build
        id: existing
        env:
          RELEASE: ${{ needs.validate.outputs.release }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ref="${FRONTEND_IMAGE}:${RELEASE}-build"
          if ! metadata="$(docker buildx imagetools inspect "$ref" --format '{{json .}}' 2>/dev/null)"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(jq -r '[.image[]?.config.Labels["org.opencontainers.image.revision"]] | unique | .[]' <<<"$metadata")" = "$GITHUB_SHA"
          test "$(jq -r '[.image[]?.config.Labels["org.opencontainers.image.version"]] | unique | .[]' <<<"$metadata")" = "$VERSION"
          test "$(jq -r '[.image[]?.config.Labels["org.opencontainers.image.created"]] | unique | .[]' <<<"$metadata")" = "${{ needs.validate.outputs.built_at }}"
          echo "digest=$(jq -r .manifest.digest <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "exists=true" >> "$GITHUB_OUTPUT"
      - name: Build frontend once
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ needs.validate.outputs.release }}-build
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ needs.validate.outputs.built_at }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Resolve frontend digest
        id: image
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Scan published frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}@${{ steps.image.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'

  publish:
    name: Publish prerelease
    needs: [validate, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download verified compliance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name verified-compliance-evidence --dir dist
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - name: Build runtime bundle and manifest
        env:
          RELEASE: ${{ needs.validate.outputs.release }}
          BUILT_AT: ${{ needs.validate.outputs.built_at }}
          BACKEND_DIGEST: ${{ needs.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.frontend.outputs.digest }}
          MIGRATION_CLASSIFICATION: ${{ inputs.migration_classification }}
        run: |
          mkdir -p dist
          archive="content-pool-${RELEASE}-runtime.tar.gz"
          ./scripts/build-runtime-bundle.sh "dist/${archive}"
          archive_sha="$(sha256sum "dist/${archive}" | cut -d' ' -f1)"
          ./scripts/release_manifest.py create \
            --release "$RELEASE" \
            --application-version "${{ needs.validate.outputs.version }}" \
            --commit "$GITHUB_SHA" \
            --built-at "$BUILT_AT" \
            --backend-image "${BACKEND_IMAGE}@${BACKEND_DIGEST}" \
            --frontend-image "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}" \
            --runtime-archive "$archive" \
            --runtime-sha256 "$archive_sha" \
            --migration-classification "$MIGRATION_CLASSIFICATION" \
            --required-configuration DEPLOYMENT_ENV \
            --required-configuration CONTENT_POOL_BACKEND_IMAGE \
            --required-configuration CONTENT_POOL_FRONTEND_IMAGE \
            --output dist/release-manifest.json
          for platform in linux/amd64 linux/arm64; do
            platform_name="${platform//\//-}"
            syft scan "${BACKEND_IMAGE}@${BACKEND_DIGEST}" \
              --platform "$platform" \
              --output "cyclonedx-json=dist/backend-${platform_name}.cdx.json"
            syft scan "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}" \
              --platform "$platform" \
              --output "cyclonedx-json=dist/frontend-${platform_name}.cdx.json"
          done
          checksums="$(mktemp)"
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z | xargs -0 sha256sum
          ) > "$checksums"
          mv "$checksums" dist/SHA256SUMS
      - name: Publish verified image tags
        env:
          RELEASE: ${{ needs.validate.outputs.release }}
          BACKEND_DIGEST: ${{ needs.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.frontend.outputs.digest }}
        run: |
          ensure_tag() {
            local target="$1" source="$2" expected="$3" actual
            if docker buildx imagetools inspect "$target" >/dev/null 2>&1; then
              actual="$(docker buildx imagetools inspect "$target" --format '{{json .}}' | jq -r .manifest.digest)"
              test "$actual" = "$expected" || {
                echo "${target} already points to ${actual}, expected ${expected}" >&2
                return 1
              }
            else
              docker buildx imagetools create --tag "$target" "$source"
            fi
            actual="$(docker buildx imagetools inspect "$target" --format '{{json .}}' | jq -r .manifest.digest)"
            test "$actual" = "$expected"
          }
          ensure_tag "${BACKEND_IMAGE}:${RELEASE}" "${BACKEND_IMAGE}@${BACKEND_DIGEST}" "$BACKEND_DIGEST"
          ensure_tag "${BACKEND_IMAGE}:sha-${GITHUB_SHA}" "${BACKEND_IMAGE}@${BACKEND_DIGEST}" "$BACKEND_DIGEST"
          ensure_tag "${FRONTEND_IMAGE}:${RELEASE}" "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}" "$FRONTEND_DIGEST"
          ensure_tag "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}" "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}" "$FRONTEND_DIGEST"
      - name: Create annotated candidate tag
        env:
          RELEASE: ${{ needs.validate.outputs.release }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify "refs/tags/${RELEASE}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE")" = "$GITHUB_SHA"
          else
            git tag -a "$RELEASE" "$GITHUB_SHA" -m "Release candidate ${RELEASE}"
            git push origin "refs/tags/${RELEASE}"
          fi
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.validate.outputs.release }}
        run: |
          gh release create "$RELEASE" dist/* \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "ContentPool ${RELEASE}"
